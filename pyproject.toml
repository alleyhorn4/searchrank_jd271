[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alleyhorn4-searchrank_jd271"
version = "0.1.0"
description = "在同一个输入里两两比对，检测搜索排序算法工程师·批处理调度与吞吐折中相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "alleyhorn4" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://alleyhorn4.github.io"
Repository = "https://github.com/alleyhorn4/searchrank_jd271"
Issues = "https://github.com/alleyhorn4/searchrank_jd271/issues"

[project.scripts]
searchrank_jd271 = "searchrank_jd271:main"

[tool.setuptools]
py-modules = ["searchrank_jd271"]
